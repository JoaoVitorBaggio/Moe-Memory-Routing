[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-memory-routing"
version = "0.1.0"
description = "MoE com roteamento consciente de memória — AGL11157 / UFRGS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "pyyaml>=6",
  "tiktoken>=0.7",
  "numpy>=1.24",
  "datasets>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["datasets>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
